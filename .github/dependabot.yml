version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Node types track the engines floor (Node 22), not the latest Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keeps the digest-pinned base image in the Dockerfile current
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
