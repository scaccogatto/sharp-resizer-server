name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Skips semver-major bumps, and minor bumps of 0.x dependencies (breaking under semver).
      # Auto-merge waits for the required status checks enforced by the ruleset.
      - name: Enable auto-merge (squash)
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          !(steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
            startsWith(steps.metadata.outputs.previous-version, '0.'))
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
